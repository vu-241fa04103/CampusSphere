# render.yaml — Deploy CampusSphere BACKEND ONLY on Render.com
# Frontend (React) is deployed separately on Vercel
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: campussphere-api
    env: node
    region: singapore
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false     # Paste MongoDB Atlas URI in Render dashboard
      - key: JWT_SECRET
        sync: false     # Paste a long random secret in Render dashboard
      - key: CLIENT_URL
        sync: false     # Paste your Vercel frontend URL e.g. https://campussphere.vercel.app
